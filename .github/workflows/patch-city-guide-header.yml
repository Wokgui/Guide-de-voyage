name: Patch City Guide header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-city-guide-header.yml'

permissions:
  contents: write

jobs:
  patch-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply City Guide header only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'id="city-guide-header-v312"'
          if marker in text:
              print('City Guide header already present')
              raise SystemExit(0)
          css = r'''
          <style id="city-guide-header-v312">
          /* En-tête City Guide validé — aucune autre partie de l'application n'est modifiée */
          header h1{
            padding-left:96px!important;
            padding-right:96px!important;
            margin-top:0!important;
            margin-bottom:9px!important;
            text-align:center!important;
          }
          header h1 .title-main{
            display:block!important;
            color:#fff!important;
            font-family:Georgia,"Times New Roman",serif!important;
            font-size:1.14em!important;
            font-weight:700!important;
            line-height:1.02!important;
            letter-spacing:.065em!important;
            text-transform:uppercase!important;
            text-shadow:0 2px 8px rgba(0,0,0,.20)!important;
          }
          header h1 .title-flags{
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            gap:7px!important;
            width:min(150px,70%)!important;
            margin:6px auto 0!important;
            color:#fff!important;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important;
            font-size:.64em!important;
            line-height:1!important;
            letter-spacing:3px!important;
            white-space:nowrap!important;
            text-shadow:none!important;
          }
          header h1 .title-flags::before,
          header h1 .title-flags::after{
            content:""!important;
            display:block!important;
            flex:1 1 auto!important;
            height:1px!important;
            background:rgba(255,255,255,.58)!important;
          }
          header h1 .title-sub{
            display:table!important;
            margin:6px auto 0!important;
            padding:4px 13px!important;
            border:1px solid rgba(255,255,255,.88)!important;
            border-radius:999px!important;
            background:linear-gradient(100deg,#1878a1,#23a9d1)!important;
            color:#fff!important;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important;
            font-size:.55em!important;
            font-weight:850!important;
            line-height:1.05!important;
            letter-spacing:.11em!important;
            text-transform:uppercase!important;
            box-shadow:0 2px 8px rgba(0,0,0,.14)!important;
          }
          .save-indicator{
            top:9px!important;
            right:9px!important;
          }
          @media(max-width:620px){
            header h1{padding-left:76px!important;padding-right:76px!important}
            header h1 .title-main{font-size:1.02em!important;letter-spacing:.045em!important}
            header h1 .title-flags{width:min(128px,68%)!important;margin-top:5px!important}
            header h1 .title-sub{margin-top:5px!important;padding:3px 10px!important;font-size:.49em!important}
          }
          @media(max-width:430px){
            header h1{padding-left:70px!important;padding-right:70px!important}
            header h1 .title-main{font-size:.90em!important;letter-spacing:.035em!important}
            header h1 .title-flags{width:min(112px,66%)!important;font-size:.60em!important}
            header h1 .title-sub{font-size:.45em!important;letter-spacing:.09em!important}
            .save-indicator{right:7px!important;top:7px!important}
          }
          </style>
          '''
          if '</head>' not in text:
              raise SystemExit('Balise </head> introuvable')
          text = text.replace('</head>', css + '\n</head>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit the header patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaurer uniquement l’en-tête City Guide"
          git push origin HEAD:main
