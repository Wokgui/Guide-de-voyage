name: Restore v347 and fix v348

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-v347-fix-v348.yml"

permissions:
  contents: write

jobs:
  restore_and_fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch
        run: |
          cp .github/scripts/restore_v348.py /tmp/restore_v348.py
          git read-tree --reset -u 79e1a10b4f9391360a721928e92771bf3cd71f1f
          python /tmp/restore_v348.py

      - name: Verify
        run: |
          node --check header-prestige.js
          node --check ui-fixes-v7.js
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q '🇩🇰' startup-stable-v345.css
          grep -q '🇸🇪' startup-stable-v345.css
          if grep -q 'cph-app-ready' startup-stable-v345.css; then exit 1; fi
          if grep -q '\[150,500,1200\]' ui-fixes-v7.js; then exit 1; fi
          if grep -q 'setTimeout(polishAll,200)' sw.js; then exit 1; fi
          if test -e .github/workflows/stabilize-startup-v345.yml; then exit 1; fi

      - name: Commit
        run: |
          git config user.name "Wokgui"
          git config user.email "149906755+Wokgui@users.noreply.github.com"
          git add -A
          git commit -m "Restaurer v347 et corriger réactivité et alignements v348"
          git push origin HEAD:main
