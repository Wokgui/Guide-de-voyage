name: Apply v355 first paint

on:
  push:
    branches:
      - fix/first-paint-style-355
    paths:
      - tools/apply-v355.mjs
      - tools/v355-trigger.txt
      - .github/workflows/apply-v355.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-paint-style-355
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consolider le CSS du premier affichage
        run: node tools/apply-v355.mjs
      - name: Vérifier v355 et les régressions existantes
        run: |
          node tests/first-paint-stability.test.mjs
          node tests/perf-runtime.test.mjs
          node tests/visit-card-layout.test.mjs
          node tests/startup-render-guard.test.mjs
          node tests/remote-render-stability.test.mjs
      - name: Commit de la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html first-paint-v355.css sw.js
          if git diff --cached --quiet; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git commit -m "Fix v355: charger le style final avant le premier rendu"
          git push origin HEAD:fix/first-paint-style-355
