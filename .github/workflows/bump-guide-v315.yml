name: Bump guide header to v315

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-guide-v315.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump header script version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '/header-prestige.js?v=314' in s:
              s=s.replace('/header-prestige.js?v=314','/header-prestige.js?v=315')
          elif '/header-prestige.js?v=315' not in s:
              raise SystemExit('Référence header-prestige introuvable')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit bump
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Charger le nouvel en-tête équilibré v315"
          git push origin HEAD:main
