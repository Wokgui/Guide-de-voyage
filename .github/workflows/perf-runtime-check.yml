name: Perf runtime check

on:
  push:
    branches:
      - perf/runtime-344
  pull_request:
    paths:
      - day-style-v1.js
      - tests/perf-runtime.test.mjs
      - .github/workflows/perf-runtime-check.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntaxe et stress 300 cycles
        run: node tests/perf-runtime.test.mjs
