name: Perf runtime check

on:
  push:
    branches:
      - perf/runtime-344
  pull_request:
    paths:
      - cloud-backup-loader.js
      - day-style-v1.js
      - dom-stability-v356.js
      - first-paint-v355.css
      - header-prestige.js
      - index.html
      - section-history-v1.js
      - shared-sync.js
      - sw.js
      - ui-fixes-v7.js
      - tests/dom-reconcile-v356.test.mjs
      - tests/perf-runtime.test.mjs
      - tests/visit-card-layout.test.mjs
      - tests/startup-render-guard.test.mjs
      - tests/remote-render-stability.test.mjs
      - tests/first-paint-stability.test.mjs
      - .github/workflows/perf-runtime-check.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntaxe, stabilité UI, premier affichage, synchronisation et stress 300 cycles
        run: |
          node tests/perf-runtime.test.mjs
          node tests/visit-card-layout.test.mjs
          node tests/startup-render-guard.test.mjs
          node tests/remote-render-stability.test.mjs
          node tests/first-paint-stability.test.mjs
          node tests/dom-reconcile-v356.test.mjs
