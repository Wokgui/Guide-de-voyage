name: Optimize tab performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-tab-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce unnecessary DOM rescans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Header prestige: ignore Leaflet's internal tile/pane churn and only
          # re-polish when visible app UI areas actually change.
          path = Path('header-prestige.js')
          text = path.read_text(encoding='utf-8')
          old = 'new MutationObserver(()=>{clearTimeout(window.__cphP);window.__cphP=setTimeout(polish,35)}).observe(document.body,{childList:true,subtree:true})'
          new = 'new MutationObserver(records=>{const relevant=records.some(r=>{const t=r.target&&r.target.nodeType===1?r.target:r.target&&r.target.parentElement;if(!t)return false;if(t.closest&&t.closest("#map,.leaflet-container,.leaflet-pane,.leaflet-control-container"))return false;return !!(t.closest&&t.closest("#programme,#carte .map-list,#suivi,header,.footer-actions"))});if(!relevant)return;clearTimeout(window.__cphP);window.__cphP=setTimeout(polish,70)}).observe(document.body,{childList:true,subtree:true})'
          if old not in text:
              raise SystemExit('header-prestige observer pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) UI fixes: same principle. The previous observer scheduled a full
          # programme/map scan for every child mutation anywhere in the document.
          path = Path('ui-fixes-v7.js')
          text = path.read_text(encoding='utf-8')
          old = 'function start(){observer=new MutationObserver(schedule);polish();[150,500,1200].forEach(ms=>setTimeout(schedule,ms));window.addEventListener("resize",schedule,{passive:true});}'
          new = 'function relevantMutation(records){return records.some(r=>{const t=r.target&&r.target.nodeType===1?r.target:r.target&&r.target.parentElement;if(!t)return false;if(t.closest&&t.closest("#map,.leaflet-container,.leaflet-pane,.leaflet-control-container"))return false;return !!(t.closest&&t.closest("#programme,#carte .map-list,#dayButtons,.history-actions"))})}\nfunction start(){observer=new MutationObserver(records=>{if(relevantMutation(records))schedule()});polish();[150,500,1200].forEach(ms=>setTimeout(schedule,ms));window.addEventListener("resize",schedule,{passive:true});}'
          if old not in text:
              raise SystemExit('ui-fixes observer pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3) Service-worker injected legacy fixer: avoid rescanning the whole map
          # when Leaflet adds/removes tiles, markers and panes.
          path = Path('sw.js')
          text = path.read_text(encoding='utf-8')
          old = 'const observer=new MutationObserver(()=>{clearTimeout(window.__cphPair336Timer);window.__cphPair336Timer=setTimeout(polishAll,35)});'
          new = 'const observer=new MutationObserver(records=>{const relevant=records.some(r=>{const t=r.target&&r.target.nodeType===1?r.target:r.target&&r.target.parentElement;if(!t)return false;if(t.closest&&t.closest("#map,.leaflet-container,.leaflet-pane,.leaflet-control-container"))return false;return !!(t.closest&&t.closest("#programme,#carte .map-list,.map-list"))});if(!relevant)return;clearTimeout(window.__cphPair336Timer);window.__cphPair336Timer=setTimeout(polishAll,70)});'
          if old not in text:
              raise SystemExit('service-worker observer pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace('copenhague-v343-static-v39', 'copenhague-v343-static-v42')
          text = text.replace('copenhague-v343-runtime-v39', 'copenhague-v343-runtime-v42')
          text = text.replace('/ui-fixes-v7.js?v=30', '/ui-fixes-v7.js?v=31')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit performance fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add header-prestige.js ui-fixes-v7.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Perf: réduire les rescans DOM lors des changements d’onglet'
            git push
          fi
