name: Fix guide startup v347

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Préparer le démarrage rapide et propre du guide v347' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Patch startup and icon
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from PIL import Image

          BG = "#f3ede1"

          # --- 1. Icône native de splash : squircle type One UI, mais avec marge interne
          # afin que l'unique icône Android ne paraisse plus énorme.
          def superellipse_mask(size, exponent=5.4, scale=.985):
              ss = 4
              S = size * ss
              mask = Image.new("L", (S, S), 0)
              px = mask.load()
              c = (S - 1) / 2
              a = c * scale
              for y in range(S):
                  ny = abs((y - c) / a)
                  for x in range(S):
                      nx = abs((x - c) / a)
                      if nx ** exponent + ny ** exponent <= 1:
                          px[x, y] = 255
              return mask.resize((size, size), Image.Resampling.LANCZOS)

          def build_splash(src_path, out_path, canvas_size):
              src = Image.open(src_path).convert("RGBA")
              inner = round(canvas_size * .62)
              src = src.resize((inner, inner), Image.Resampling.LANCZOS)
              src.putalpha(Image.composite(src.getchannel("A"), Image.new("L", (inner, inner), 0), superellipse_mask(inner)))
              canvas = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
              p = (canvas_size - inner) // 2
              canvas.alpha_composite(src, (p, p))
              canvas.save(out_path, optimize=True)

          build_splash("icons/app-icon-192.png", "icons/splash-any-192-v347.png", 192)
          build_splash("icons/app-icon-512.png", "icons/splash-any-512-v347.png", 512)

          # --- 2. Manifeste : une seule étape native. Pas de seconde icône web.
          mp = Path("manifest.webmanifest")
          manifest = json.loads(mp.read_text(encoding="utf-8"))
          manifest["start_url"] = "/?v=20260816-347"
          manifest["background_color"] = BG
          manifest["icons"] = [
              {"src":"/icons/splash-any-192-v347.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/icons/splash-any-512-v347.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"/icons/app-icon-192.png?v=4","sizes":"192x192","type":"image/png","purpose":"maskable"},
              {"src":"/icons/app-icon-512.png?v=4","sizes":"512x512","type":"image/png","purpose":"maskable"}
          ]
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          # --- 3. Supprimer totalement la petite icône/overlay ajouté dans la page.
          # On garde seulement la feuille Prestige chargée tôt et le fond cohérent.
          cp = Path("startup-stable-v345.css")
          css = cp.read_text(encoding="utf-8")
          cut = css.find("/* v345 — premier rendu strictement identique à l'état final. */")
          if cut >= 0:
              css = css[:cut]
          css = css.rstrip() + "\n\n/* v347 : pas d'overlay ni de masquage du BODY. */\nhtml,body{background:#f3ede1!important}\n"
          cp.write_text(css, encoding="utf-8")

          # --- 4. Restaurer le comportement normal du header et enlever l'attente artificielle.
          hp = Path("header-prestige.js")
          js = hp.read_text(encoding="utf-8")
          original_flags = '''function ensureFlags(){const title=document.querySelector("header h1");if(!title||title.querySelector(".cph-balanced-flags"))return;const f=document.createElement("span");f.className="cph-balanced-flags";f.innerHTML="<span>🇩🇰</span><span>🇸🇪</span>";const sub=title.querySelector(".title-sub");sub?title.insertBefore(f,sub):title.appendChild(f)}'''
          js = re.sub(r'function ensureFlags\(\)\{\}', original_flags, js, count=1)
          js = re.sub(r'function revealWhenStable\(\)\{.*?\n\}\nfunction polish\(\)', 'function polish()', js, count=1, flags=re.S)
          js = js.replace('revealWhenStable();', '')
          js = js.replace('[250,800,1600].forEach(ms=>setTimeout(polish,ms));', '')
          js = js.replace('window.__cphP=setTimeout(polish,35)', 'window.__cphP=setTimeout(polish,110)')
          hp.write_text(js, encoding="utf-8")

          # --- 5. Service worker : cache immédiat au lancement au lieu d'attendre le réseau.
          sp = Path("sw.js")
          sw = sp.read_text(encoding="utf-8")
          sw = re.sub(r'const STATIC_CACHE="[^"]+";', 'const STATIC_CACHE="copenhague-v347-static-v47";', sw, count=1)
          sw = re.sub(r'const RUNTIME_CACHE="[^"]+";', 'const RUNTIME_CACHE="copenhague-v347-runtime-v47";', sw, count=1)
          sw = re.sub(r'/startup-stable-v345\.css\?v=\d+', '/startup-stable-v345.css?v=347', sw)
          sw = re.sub(r'/header-prestige\.js\?v=\d+', '/header-prestige.js?v=347', sw)
          sw = re.sub(r'\n\s*"/icons/splash-any-192-v346\.png",?', '', sw)
          sw = re.sub(r'\n\s*"/icons/splash-any-512-v346\.png",?', '', sw)
          if '"/icons/splash-any-192-v347.png"' not in sw:
              sw = sw.replace('"/manifest.webmanifest",', '"/manifest.webmanifest",\n  "/icons/splash-any-192-v347.png",\n  "/icons/splash-any-512-v347.png",', 1)

          old_nav = '''  let response;\n  try{\n    response=await fetch(request,{cache:"no-store"});\n    if(!response.ok)throw new Error("navigation network error");\n    await remember(request,response.clone());\n  }catch(_){\n    response=(await caches.match(request))||(fallback?await caches.match(fallback):undefined);\n    if(!response)return Response.error();\n  }\n  try{'''
          new_nav = '''  let response=(await caches.match(request))||(fallback?await caches.match(fallback):undefined);\n  if(response){\n    fetch(request,{cache:"no-store"}).then(r=>{if(r&&r.ok)return remember(request,r)}).catch(()=>null);\n  }else{\n    try{\n      response=await fetch(request,{cache:"no-store"});\n      if(!response.ok)throw new Error("navigation network error");\n      await remember(request,response.clone());\n    }catch(_){return Response.error();}\n  }\n  try{'''
          if old_nav in sw:
              sw = sw.replace(old_nav, new_nav, 1)

          old_head = '''  try{\n    const response=await fetch(request,{cache:"no-store"});\n    if(!response.ok)return response;\n    let source=await response.text();'''
          new_head = '''  try{\n    let response=await caches.match(request);\n    if(response){\n      fetch(request,{cache:"no-store"}).then(r=>{if(r&&r.ok)return remember(request,r)}).catch(()=>null);\n    }else{\n      response=await fetch(request,{cache:"no-store"});\n      if(!response.ok)return response;\n      await remember(request,response.clone());\n    }\n    let source=await response.text();'''
          if old_head in sw:
              sw = sw.replace(old_head, new_head, 1)

          sw = sw.replace('polishAll();setTimeout(polishAll,200);setTimeout(polishAll,700);setTimeout(polishAll,1500);', 'polishAll();')
          sw = sw.replace('window.__cphPair336Timer=setTimeout(polishAll,35)', 'window.__cphPair336Timer=setTimeout(polishAll,110)')
          sp.write_text(sw, encoding="utf-8")

      - name: Commit v347
        run: |
          git config user.name "Wokgui"
          git config user.email "149906755+Wokgui@users.noreply.github.com"
          git rm -f .github/workflows/fix-startup-v347.yml .github/workflows/fix-startup-v346.yml .github/workflows/fix-startup-v346b.yml .github/workflows/stabilize-startup-v345.yml 2>/dev/null || true
          git add header-prestige.js startup-stable-v345.css manifest.webmanifest sw.js icons/splash-any-192-v347.png icons/splash-any-512-v347.png
          git commit -m "Rendre le démarrage du guide rapide et stable v347"
          git push
